[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolnook-contracts"
version = "0.1.0"
description = "A local-first, file-based double-entry accounting ledger CLI for small teams and freelancers"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alex Rivera", email = "alex.rivera@protonmail.com" }]
requires-python = ">=3.9"
keywords = ["accounting", "ledger", "double-entry", "bookkeeping", "cli", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

[project.scripts]
ledgerlite = "ledgerlite.cli:main"

[project.urls]
Homepage = "https://github.com/toolnook/contracts"
Issues = "https://github.com/toolnook/contracts/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
